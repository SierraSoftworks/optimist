[package]
name = "optimist-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
optimist = { path = ".." }
serde = "1"
serde_json = "1"
serde_yaml_ng = "0.10.0"

[[bin]]
name = "squiggle_programs"
path = "fuzz_targets/squiggle_programs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "system_documents"
path = "fuzz_targets/system_documents.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mutation_batches"
path = "fuzz_targets/mutation_batches.rs"
test = false
doc = false
bench = false
