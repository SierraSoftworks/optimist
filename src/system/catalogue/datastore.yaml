id: datastore
name: Datastore
icon: store
summary: >
  Durable storage with independent limits on operation rate, transfer rate, and
  resident volume. Reaching any one of them bottlenecks the system, and which
  one binds first depends on record size rather than on the store itself.

  Latency here is not a fixed property. It rises with how hard the store is being
  driven, and because that delay travels back to whoever called, a store near its
  ceiling consumes the capacity of every service waiting on it.
ports:
  in:
    operations:
      arity: many
      summary: Writers and readers issuing operations.
      publishes:
        latency: latency
        success: success_rate
        capacity: operation_limit
        payload: record_size
  out:
    replication:
      arity: many
      summary: Replication or downstream propagation.
      publishes:
        rate: replicated
        payload: record_size
properties:
  operation_limit:
    unit: op/s
    summary: Sustained operations per second, the device or service IOPS ceiling.
  transfer_limit:
    unit: B/s
    summary: Sustained bytes per second across the storage path.
  volume_limit:
    unit: B
    summary: Usable capacity before writes fail or eviction begins.
  record_size:
    unit: B/op
    summary: >
      Bytes moved per operation. Carries a per-operation unit so that multiplying
      by an operation rate yields a transfer rate rather than a dimensional
      mistake.
  retention:
    unit: s
    summary: >
      How long a record remains resident. Combined with the ingest rate this
      fixes the steady-state volume, by Little's Law.
  service_time:
    unit: s
    summary: >
      Time to complete one operation with the store lightly loaded. Sets the
      floor on the latency a caller sees; queueing above it is derived rather
      than measured separately.
    default: '0.001'
  concurrency_limit:
    unit: op
    summary: >
      Operations the store can have in progress at once: connections, sessions,
      or worker threads. Distinct from the operation limit, which is a rate.
      Either can bind first and they fail differently, so a store sized for
      throughput can still be brought down by callers that each hold on longer
      than expected.

      Unlimited by default, which keeps the store a pure rate limit unless an
      author says otherwise.
    default: 'infinity'
  replication_factor:
    unit: '1'
    summary: Copies written downstream for each operation accepted.
    default: '0'
channels:
  arriving:
    unit: op/s
    summary: Operations arriving from all callers.
    expression: in.operations.rate
  cancelled:
    unit: op/s
    summary: Operations abandoned by the caller before the store answered.
    expression: in.operations.cancellation
  salvaged:
    unit: op/s
    summary: >
      Cancellations arriving early enough that the operation is never started, at
      the share the relationship they arrived on reports.
    expression: cancelled * in.operations.cancellation_effectiveness
  operations:
    unit: op/s
    emphasis: key
    summary: >
      Operations that consume the store. A cancellation arriving too late to
      prevent the work saves nothing, which is why cancelling saves less than it
      appears to.
    expression: max([arriving - salvaged, 0])
  transfer:
    unit: B/s
    summary: Bytes moved per second.
    expression: operations * record_size
  utilisation:
    unit: share
    emphasis: key
    summary: >
      Operation rate against the store's ceiling. Reported because it is the
      figure an operator recognises; the delay it causes is computed on the wire
      in front of the store, where the queue actually is.
    expression: Queue.utilisation(operations, operation_limit)
  held:
    unit: op
    summary: >
      Operations in progress at once, as reported by the callers holding them
      open. Read from what arrives rather than derived here, because how long a
      caller holds on is a fact about the caller's own patience as much as about
      this store.
    expression: in.operations.occupancy
  concurrency:
    unit: '1'
    summary: Share of simultaneous capacity in use.
    expression: Queue.utilisation(held, concurrency_limit)
  latency:
    unit: s
    emphasis: key
    summary: >
      Time one operation takes once the store is working on it, stretched by how
      much of its simultaneous capacity is already spoken for. Waiting to get
      that far happens in the buffer in front of the store and is reported there,
      so counting it here as well would charge a caller twice for one delay.

      The stretching is what makes this store worth pairing with a caller that
      holds a connection for the whole call. Each of them slows the other: the
      store's delay decides how many connections are held, and the connections
      held decide the store's delay. A pair like that has two resting states over
      a band of load rather than one, and which of them a design is sitting in is
      not something its configuration can tell you.
    expression: service_time / max([1 - concurrency, 0.001])
  success_rate:
    unit: share
    emphasis: key
    summary: >
      Share of arriving operations answered successfully. A store has nothing
      behind it that could fail on its behalf, so every operation that reaches it
      is answered.

      Neither cancellation nor overload appears here. Operations the store had no
      room for are refused by the queue on the wire in front of it and counted
      there; operations the caller withdrew are counted by the behaviour that
      withdrew them. Restating either would charge one failure twice.
    expression: '1'
  replicated:
    unit: op/s
    summary: Operations propagated to replicas.
    expression: operations * replication_factor
  records:
    unit: op
    summary: >
      Records resident in steady state, by Little's Law applied to the ingest
      rate and the retention window.
    expression: Little.occupancy(operations, retention)
  volume:
    unit: B
    emphasis: key
    summary: Bytes resident in steady state.
    expression: records * record_size
constraints:
  concurrency:
    emphasis: key
    summary: >
      Operations in progress against how many the store can hold at once. Rises
      when callers hold on longer even if they call no more often, which is how a
      store that is comfortably within its rate limit can still be the thing that
      brings a system down.
    demand: held
    limit: concurrency_limit
  operations:
    emphasis: key
    summary: >
      Operation rate against the store's ceiling. Binds first for workloads of
      many small records.
    demand: operations
    limit: operation_limit
  transfer:
    emphasis: key
    summary: >
      Byte rate against the storage path. Binds first for workloads of few large
      records, which is why record size decides which limit a system meets.
    demand: transfer
    limit: transfer_limit
  volume:
    emphasis: key
    summary: >
      Resident bytes against usable capacity. Unlike the rate limits this one
      fills gradually and then fails abruptly, so headroom here is measured in
      time rather than in load.
    demand: volume
    limit: volume_limit
