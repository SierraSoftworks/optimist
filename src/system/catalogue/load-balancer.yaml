id: load-balancer
name: Load balancer
icon: balancer
summary: >
  Fronts a backend fleet, forwarding demand to it and holding a connection open
  for every request in flight. A sharded scale unit around the backends divides
  forwarded demand between their replicas.

  A connection is held for the whole round trip, so backends slowing down
  consumes this component's connection limit without any change in demand at all.

  Refusing work is not a property of this component. A balancer that sheds load
  is making a decision about who to disappoint, and that decision belongs on the
  relationship in front of it as an explicit load-shedding behaviour, where it
  can be stated, moved, and compared against the alternatives.
ports:
  in:
    requests:
      arity: many
      summary: Callers arriving at the entry point.
      publishes:
        latency: latency
        success: success_rate
        capacity: backend_capacity
  out:
    backends:
      arity: many
      summary: Backends receiving forwarded work.
      publishes:
        rate: forwarded
        cancellation: propagated_cancellation
properties:
  connection_limit:
    unit: op
    summary: Concurrent connections the balancer will hold open.
  overhead:
    unit: s
    summary: Latency added by the hop itself.
    default: '0'
channels:
  arriving:
    unit: op/s
    summary: Demand arriving from all callers.
    expression: in.requests.rate
  cancelled:
    unit: op/s
    summary: Requests the caller abandoned before an answer arrived.
    expression: in.requests.cancellation
  propagated_cancellation:
    unit: op/s
    summary: >
      Cancellations passed on to backends, at the share the relationship they
      arrived on reports arriving early enough to matter.
    expression: cancelled * in.requests.cancellation_effectiveness
  rate:
    unit: op/s
    summary: Demand still wanted by the time it reaches the balancer.
    expression: max(arriving - propagated_cancellation, 0)
  backend_capacity:
    unit: op/s
    emphasis: key
    summary: >
      Rate the fleet behind this balancer sustains, which is the rate the
      balancer drains at: it holds no work of its own. Published to callers so
      the queue on the wire in front knows what it is emptying into, and taken as
      the slowest backend because a request reaching several can go no faster
      than the least of them.
    expression: out.backends.capacity
  forwarded:
    unit: op/s
    emphasis: key
    summary: >
      Demand sent to the backends, which is everything the balancer was offered:
      it holds no work of its own and refuses none by itself. Put replicated
      backends in a sharded scale unit to divide this demand between them.

      Not capped at the fleet's capacity. Work the backends have no room for is
      refused by the queue on the wire between them and this balancer, and
      trimming it here as well would charge the same shortfall twice and leave
      an undersized fleet reporting itself comfortably at its limit.
    expression: rate
  backend_wait:
    unit: s
    summary: Time the slowest backend takes to answer.
    expression: out.backends.latency
  latency:
    unit: s
    emphasis: key
    summary: Time a caller waits, the hop itself plus the backend answering it.
    expression: overhead + backend_wait
  backend_success:
    unit: share
    summary: Share of forwarded requests the backends answered successfully.
    expression: out.backends.success
  success_rate:
    unit: share
    emphasis: key
    summary: >
      Share of arriving requests answered successfully, which is the share the
      backends held.

      Overload does not appear here, for the same reason it does not appear in a
      pool's success rate. Work the fleet has no room for is refused by the queue
      on the wire in front of this balancer, which drains at the capacity this
      component publishes; counting it here as well would charge the same
      shortfall twice and report a design serving a quarter of its traffic as
      serving a sixteenth of it. Cancellation is counted by the behaviour that
      raised it, and deliberate refusal by the load-shedding behaviour that chose
      it.
    expression: backend_success
  connections:
    unit: op
    emphasis: key
    summary: >
      Connections held open, by Little's Law. A connection is held for the whole
      round trip, so backends slowing down consumes this limit without any change
      in demand.
    expression: Little.occupancy(forwarded, latency)
constraints:
  connections:
    emphasis: key
    summary: >
      Connections held against the limit. Rises when backends slow down even if
      demand is unchanged, which is how a latency problem downstream becomes an
      availability problem here.
    demand: connections
    limit: connection_limit
