rate:
  unit: op/s
  summary: >
    Operations per second travelling along the relationship. The demand a
    component places on whatever is downstream of it.
  aggregate: sum
  extensive: true

occupancy:
  unit: op
  summary: >
    Operations in flight along the relationship: work a caller is holding open
    against whatever is downstream of it. Adds across arrivals and is shared out
    across replicas, as a rate is, because it counts work rather than describing
    it.

    Distinct from rate because a resource can be sized by either, and which one
    binds is not a property of the resource. A connection pool is exhausted by
    calls held at once; a service is exhausted by calls arriving per second. A
    component that publishes this is asserting that the caller holds something
    for the whole call, which is what allows the callee's delay to feed back into
    the callee's own occupancy.
  aggregate: sum
  extensive: true

added_latency:
  unit: s
  summary: >
    Time this hop adds to a call. Arrivals take the largest rather than the sum,
    because a caller fanning out to several dependencies waits for the slowest,
    not for all of them end to end.
  aggregate: max
  extensive: false

payload:
  unit: B/op
  summary: >
    Bytes carried by one operation. Averaged across arrivals, which is exact when
    callers send similar payloads and understates the spread when they do not; a
    mix of very different payload sizes is better modelled as separate flows.
  aggregate: mean
  extensive: false
