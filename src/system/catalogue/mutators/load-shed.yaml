id: load-shed
name: Load shedding
summary: >
  Refuses demand above a fixed rate. The only behaviour here that acts on demand
  rather than on how long a call waits, which is what makes it the one lever
  capable of pulling a congested system back out of congestion.
properties:
  limit:
    unit: op/s
    summary: >
      Rate above which calls are refused. Setting it below the downstream
      capacity is the point: a limit above capacity sheds nothing until the
      dependency has already saturated.
requests:
  rate:
    unit: op/s
    summary: >
      Demand capped per draw at the limit. The share of draws pinned to the
      limit is the share being refused, and it is a cost paid deliberately in
      exchange for the rest of the traffic being served.
    expression: min([signal.rate, limit])
responses:
  success:
    unit: share
    summary: >
      Success reduced by the share of demand that was refused. Shedding is not
      free and is not invisible: a caller whose request is turned away at the
      door has not been served, however healthy the traffic behind the limit
      looks.

      Without this the model would report a shedding system as almost perfectly
      successful while it refused most of its traffic, which is precisely the
      reading that makes shedding look like a solution rather than a choice
      about who to disappoint.
    expression: signal.success * min([limit / max([request.rate, 0.000001]), 1])
