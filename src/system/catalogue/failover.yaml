id: failover
name: Failover
icon: balancer
summary: >
  Splits demand between two independent backends and shifts it away from the
  primary as the primary's health falls. The two legs are separate designs with
  their own capacity, so moving work between them is a real redistribution:
  what the primary stops taking, the standby starts.

  Distinct from replication inside a scale unit. A scale unit's replicas are
  copies of one design, and losing some of them is a loss of capacity in that
  unit, which is what a smaller replica count says. This component is for the
  other case, where the alternative is somewhere else entirely: another region,
  an older version, a different provider.

  Both outbound ports must be attached. An empty port answers instantly and
  without fail, so a standby that does not exist would make failing over look
  free.
ports:
  in:
    requests:
      arity: many
      summary: Callers reaching the pair.
      publishes:
        latency: latency
        success: success_rate
  out:
    primary:
      arity: many
      required: true
      summary: The backend preferred while it is healthy.
      publishes:
        rate: to_primary
        cancellation: primary_cancellation
    standby:
      arity: many
      required: true
      summary: The backend demand moves to as the primary degrades.
      publishes:
        rate: to_standby
        cancellation: standby_cancellation
properties:
  primary_weight:
    unit: share
    default: '1'
    summary: >
      Share of demand the primary takes while it is healthy. One is a true
      active/standby pair, a half splits evenly, and zero parks the primary
      behind the standby.

      May be written against `t`, which is how a progressive rollout is
      expressed: the weight becomes a schedule, and the solve reports what each
      stage of it costs rather than only where it ends up.
  latency_threshold:
    unit: s
    default: '1e9'
    summary: >
      Primary latency at which demand starts moving to the standby. Defaults
      high enough never to trip, so a pair that fails over on success alone
      does not have to invent a time.
  success_threshold:
    unit: share
    default: '0'
    summary: >
      Primary success below which demand starts moving to the standby. Defaults
      to zero, which never trips, so a pair that fails over on latency alone
      does not have to invent a success rate.
  overhead:
    unit: s
    summary: Latency added by the hop itself.
    default: '0'
channels:
  arriving:
    unit: op/s
    summary: Demand arriving from all callers.
    expression: in.requests.rate
  cancelled:
    unit: op/s
    summary: Requests the caller abandoned before an answer arrived.
    expression: in.requests.cancellation
  propagated_cancellation:
    unit: op/s
    summary: >
      Cancellations arriving early enough to save the work, at the share the
      relationship they arrived on reports.
    expression: cancelled * in.requests.cancellation_effectiveness
  rate:
    unit: op/s
    summary: Demand still wanted by the time it reaches the pair.
    expression: max(arriving - propagated_cancellation, 0)
  primary_latency:
    unit: s
    summary: Time the primary takes to answer.
    expression: out.primary.latency
  primary_success:
    unit: share
    summary: Share of requests the primary answered successfully.
    expression: out.primary.success
  latency_health:
    unit: share
    summary: >
      Share of the primary still considered fit on time. One while it answers
      inside the threshold, then falling as the ratio does: at twice the
      threshold half the traffic has moved.
    expression: min(max(latency_threshold / max(primary_latency, 0.000001), 0), 1)
  success_health:
    unit: share
    summary: >
      Share of the primary still considered fit on success, on the same
      reading as the latency term.
    expression: min(max(primary_success / max(success_threshold, 0.000001), 0), 1)
  primary_health:
    unit: share
    emphasis: key
    summary: >
      How much of the primary is still passing its health check, which is the
      worse of the two thresholds: one bad enough is enough.

      Continuous rather than a step, for two reasons. A health check ejects
      endpoints one at a time as a backend degrades, so a rising share of the
      traffic moves rather than all of it at once. And a step would give the
      relaxation nothing to descend, leaving the design oscillating between
      two answers instead of settling on one.
    expression: min(latency_health, success_health)
  primary_share:
    unit: share
    emphasis: key
    summary: Share of demand actually reaching the primary.
    expression: primary_weight * primary_health
  standby_share:
    unit: share
    emphasis: key
    summary: >
      Share of demand the standby carries: its own weighting plus everything
      the primary has stopped taking. This is the figure to size the standby
      against, because the case that matters is the one where it is not the
      share the design normally sends.
    expression: 1 - primary_share
  to_primary:
    unit: op/s
    emphasis: key
    summary: Demand sent to the primary.
    expression: rate * primary_share
  to_standby:
    unit: op/s
    emphasis: key
    summary: Demand sent to the standby.
    expression: rate * standby_share
  primary_cancellation:
    unit: op/s
    summary: Cancellations passed on to the primary, at its share of the demand.
    expression: propagated_cancellation * primary_share
  standby_cancellation:
    unit: op/s
    summary: Cancellations passed on to the standby, at its share of the demand.
    expression: propagated_cancellation * standby_share
  standby_latency:
    unit: s
    summary: Time the standby takes to answer.
    expression: out.standby.latency
  standby_success:
    unit: share
    summary: Share of requests the standby answered successfully.
    expression: out.standby.success
  latency:
    unit: s
    emphasis: key
    summary: >
      Time a caller waits, blended across the two legs at the share each
      carries. Blended rather than taken as the slower of them, because a
      request goes to one backend or the other: this is a choice between paths,
      not a fan-out that waits for both.
    expression: overhead + primary_share * primary_latency + standby_share * standby_latency
  success_rate:
    unit: share
    emphasis: key
    summary: >
      Share of arriving requests answered successfully, blended across the two
      legs for the same reason the latency is.

      Failing over is therefore only as good as what it fails over to. A pair
      whose standby is slower or smaller reports the whole cost of leaning on
      it, which is the question worth asking of a standby that has never been
      used in anger.
    expression: primary_share * primary_success + standby_share * standby_success
