id: browsers
name: Browsers
type: client
properties:
  latency_target: '0.5'
  payload: '512'
  request_rate: demand
  success_target: '0.99'
position:
  x: 0.0
  y: 0.0
outgoing:
- to: api
  capacity: link_capacity
  mutators:
  - type: timeout
    properties:
      budget: '5'
  - type: cancellation-effectiveness
    properties:
      effectiveness: '0.2'
  - type: load-shed
    properties:
      limit: rate_limit
  summary: |
    Checkout requests. The browser gives up after five seconds and only a fifth of the work it abandons is ever reclaimed, but it does not retry: whatever the API reports is what the user experiences. The amplification this example is about belongs to the API's call to the store and to nothing else, so there is deliberately no second retry layer here to share the blame with.
