id: api
name: Orders API
type: compute
properties:
  parallelism: api_parallelism
  service_time: 0.002 * lognormal(0, 0.1)
position:
  x: 0.0
  y: 160.0
outgoing:
- to: orders
  mutators:
  - type: retry
    properties:
      attempts: max_attempts
  - type: timeout
    properties:
      budget: attempt_timeout
  summary: |
    Order lookups, with the two policies every client library ships with. The timeout decides that a slow answer is a failure; the retry answers that failure with another attempt. Each is defensible alone.
