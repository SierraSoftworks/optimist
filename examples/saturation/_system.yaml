schema_version: 2
name: Saturation and retries
summary: |
  The smallest design that can go wrong: browsers call an API, the API reads from a store, and that read is wrapped in the two policies every client library ships with — a timeout and a retry.
  Nothing here is exotic. The store holds a limited number of operations in flight, which is the ordinary consequence of a connection pool. That single limit is enough to make latency a function of load rather than a property of the store, and once latency depends on load, the timeout has something to fire on and the retry has something to answer.
  Read it for three things: where saturation actually comes from, why adding retries lowers the share of requests that succeed rather than raising it, and why the design takes so much longer to recover than the surge took to arrive.
scratchpad:
- name: base_demand
  expression: '600'
  unit: op/s
  summary: |
    Requests per second at rest. A quarter of the fold computed below, which is the sort of headroom a capacity plan is signed off with.
- name: surge_factor
  expression: '3.5'
  unit: '1'
  summary: |
    Multiple of resting demand during the surge window. Rebind to one to ask what the same design looks like with nothing in its past.
- name: demand
  expression: |
    if t >= 5 && t < 15 then base_demand * surge_factor else base_demand
  unit: op/s
  summary: Offered load over the run, with the surge in the middle.
- name: store_concurrency
  expression: '100'
  unit: op
  summary: |
    Operations the store holds in flight at once: its connection pool. This is the limit that turns the store's latency into a function of how hard it is being driven, and it is the only unusual thing in the design.
- name: api_replicas
  expression: '5'
  unit: '1'
  summary: |
    Instances of the API behind the load balancer. Demand divides between them, so this multiplies the pool below rather than replacing it.
- name: api_parallelism
  expression: '30'
  unit: op
  summary: |
    Requests one instance serves concurrently. A worker is held for the whole of the call to the store, so this pool is spent waiting rather than working, and it is the store's latency rather than the API's own work that decides how many requests a second an instance can carry.
- name: attempt_timeout
  expression: '0.05'
  unit: s
  summary: |
    How long one attempt at the store waits before it is abandoned and counted as a failure. Five times the store's idle latency, which sounds generous and is the number a careful engineer picks.
    It is the most consequential quantity in the design and the one chosen with the least evidence. Compare `patient-timeout`.
- name: max_attempts
  expression: '3'
  unit: '1'
  summary: |
    Attempts per call to the store, including the first. Three is the default in most client libraries, and is chosen here for exactly that reason.
- name: link_capacity
  expression: '400'
  unit: op
  summary: |
    Requests the wire in front of the API will hold waiting. Nobody chooses this: it is a socket buffer and a listen backlog, and it is there whether or not the design mentions it.
    It is also the design's memory. A surge arriving faster than the API can serve is stored here, and recovery time is the time this takes to drain.
- name: region_count
  expression: '1'
  unit: '1'
  summary: The total number of regions being operated by the service, each region can operate independently of the others and serve requests without depending on another region.
- name: rate_limit
  expression: '10000'
  unit: op/s
  summary: The maximum number of requests which are allowed to be served by the system each second, requests above this limit are rejected.
scale_units:
- id: region
  name: Region
  summary: Distinct deployed regions which can independently process requests
  replicas: region_count
  distribution: sharded
  members:
  - orders
  parent: null
- id: api-fleet
  name: API instances
  summary: |
    The API's instances within one region. Replication belongs here rather than on the component, because a component's properties describe one replica: `api_parallelism` is what one instance serves concurrently, and this says how many of those exist.
  replicas: api_replicas
  distribution: sharded
  members:
  - api
  parent: region
interventions:
- id: no-surge
  name: Steady State
  summary: |
    Shows how the design performs in the absence of a load surge.
  overrides:
  - name: surge_factor
    expression: '1'
- id: no-retries
  name: Disable Retries
  summary: |-
    This shows the impact of disabling retries within the system on both steady state and saturation recovery.

    Note how this doesn't improve system performance during the load spike, however it does help the system recover almost immediately once the load is removed (by removing a positive feedback loop).
  overrides:
  - name: max_attempts
    expression: '1'
- id: patient-timeout
  name: Increase Timeouts
  summary: |
    Increases the timeout to the backend store in an effort to resolve the failures.
  overrides:
  - name: attempt_timeout
    expression: '10'
- id: deep-link
  name: Increased API Queue Size
  summary: |
    Widens the wire in front of the API fivefold. The instinct that a bigger buffer absorbs a burst, priced in the time it then takes to clear.
  overrides:
  - name: link_capacity
    expression: '2000'
- id: increased-db-connections
  name: Increased DB Connections
  summary: |-
    Increases the number of concurrent connections which can be open to the database at any given time.

    Note how this enables partial success during the load spike but the system doesn't recover to a healthy state once the spike subsides.
  overrides:
  - name: store_concurrency
    expression: '500'
- id: load-shedding
  name: Load Shedding
  summary: Enabling the shedding of load to help the system avoid saturation, maximizing the number of requests we can serve successfully during a load spike.
  overrides:
  - name: rate_limit
    expression: '650'
