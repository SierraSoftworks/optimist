[package]
name = "optimist"
version = "0.1.0"
edition = "2024"

[dependencies]
ariadne = "0.6.0"
axum = { version = "0.8.4", features = ["ws"] }
chrono = { version = "0.4.41", default-features = false }
chumsky = "0.13.0"
clap = { version = "4.5.41", features = ["derive", "env"] }
colored = "3.1.1"
include_dir = "0.7.4"
human-errors = { version = "0.2.4", features = ["pretty"] }
mime_guess = "2.0.5"
rand = "=0.10.2"
rand_chacha = "=0.10.0"
rust-embed = "8.7.2"
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = "1.0.141"
serde_yaml_ng = "0.10.0"
statrs = "=0.19.0"
textwrap = { version = "0.16.2", features = ["terminal_size"] }
tokio = { version = "1.46.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
indicatif = "0.18.6"
mimalloc = { version = "0.1.52", default-features = false }
rayon = "1.12.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
futures-util = "0.3.31"
proptest = "1.7.0"
reqwest = { version = "0.12.22", default-features = false, features = ["json", "rustls-tls"] }
rstest = "0.26.1"
tokio-tungstenite = "0.30.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[features]
# Counts the work a solve does. Off by default so the counters compile away.
profiling = []

# End-to-end sweeps that solve a shipped design over a long horizon. They cover
# behaviour no unit test can reach, and they cost more than the rest of the suite
# put together, so they are opt-in: run them when the solver, the statistics, or
# the language changed, and before signing work off.
comprehensive_tests = []

# A solve is thousands of passes through the same short expressions, so whether
# the small functions making up a pass get inlined across module boundaries
# matters more here than build time does.
[profile.release]
codegen-units = 1
lto = "thin"

# The suite spends nearly all of its time inside the solver, so an unoptimised
# build dominates it: measured across the whole suite, `opt-level = 2` turns 408
# CPU-seconds of test execution into 48, and the slowest test from 35s into 3s.
# That buys far more than it costs to compile, and debug assertions stay on.
[profile.test]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

[[bench]]
name = "solve"
harness = false

[[bench]]
name = "squiggle"
harness = false
