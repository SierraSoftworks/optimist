[package]
name = "optimist"
version = "0.1.0"
edition = "2024"

[dependencies]
ariadne = "0.5.1"
axum = { version = "0.8.4", features = ["ws"] }
chrono = { version = "0.4.41", default-features = false }
chumsky = "0.11.1"
clap = { version = "4.5.41", features = ["derive", "env"] }
colored = "3.1.1"
include_dir = "0.7.4"
human-errors = { version = "0.2.4", features = ["pretty"] }
mime_guess = "2.0.5"
rand = "=0.8.7"
rand_chacha = "=0.3.1"
rust-embed = "8.7.2"
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = "1.0.141"
serde_yaml_ng = "0.10.0"
statrs = "=0.18.0"
textwrap = { version = "0.16.2", features = ["terminal_size"] }
tokio = { version = "1.46.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }

[dev-dependencies]
futures-util = "0.3.31"
proptest = "1.7.0"
reqwest = { version = "0.12.22", default-features = false, features = ["json", "rustls-tls"] }
rstest = "0.26.1"
tokio-tungstenite = "0.29.0"
