version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      axum:
        patterns:
          - "axum*"
          - "tokio*"
      squiggle:
        patterns:
          - "chumsky"
          - "ariadne"
      # Pinned together because the solver's seeded draws have to stay
      # reproducible across the whole random stack.
      random:
        patterns:
          - "rand*"
          - "statrs"

  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "weekly"

  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: "daily"
    groups:
      vuepress:
        patterns:
          - "vuepress*"
          - "@vuepress/*"

  - package-ecosystem: npm
    directory: "/workbench"
    schedule:
      interval: "daily"
    groups:
      vue:
        patterns:
          - "vue"
          - "vue-*"
          - "@vue/*"
          - "@vitejs/*"
          - "pinia"
          - "element-plus"
          - "@element-plus/*"
      codemirror:
        patterns:
          - "codemirror"
          - "@codemirror/*"
          - "@lezer/*"
      vite:
        patterns:
          - "vite"
          - "vitest"
      playwright:
        patterns:
          - "@playwright/*"
          - "playwright*"
